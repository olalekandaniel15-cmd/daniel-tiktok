{% extends "base.html" %}{% block content %}<section class="panel wide-panel"><small>YOUR CONNECTIONS</small><h1>Inbox</h1><h3>Recent conversations</h3>{% for p in people %}<p><a href="{{ url_for('messages',uid=p.id) }}">@{{ p.username }} — Open chat →</a></p>{% else %}<p>No conversations yet.</p>{% endfor %}<hr><h3>Find a member</h3>{% for u in users %}<p><a href="{{ url_for('messages',uid=u.id) }}">Message @{{ u.username }} →</a></p>{% endfor %}</section>{% endblock %}
