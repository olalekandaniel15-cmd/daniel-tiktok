{% extends "base.html" %}{% block content %}<section class="panel wide-panel"><small>VIDEO CALL</small><h1>Call @{{ other.username }}</h1><p>This page demonstrates local camera preview and WebRTC signaling storage. For reliable calls between users, connect a TURN server and complete authenticated signaling/ICE exchange.</p><div class="call-grid"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><button class="cta" onclick="startCall()">Start camera</button><button class="cta secondary" onclick="endCall()">End</button><p id="callStatus">Not connected.</p></section><script>let localStream;async function startCall(){try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('local').srcObject=localStream;document.getElementById('callStatus').textContent='Camera ready. Add WebRTC peer negotiation and TURN service for actual remote calls.';}catch(e){document.getElementById('callStatus').textContent=e.message;}}function endCall(){if(localStream)localStream.getTracks().forEach(t=>t.stop());document.getElementById('local').srcObject=null;document.getElementById('callStatus').textContent='Call ended.';}</script>{% endblock %}
