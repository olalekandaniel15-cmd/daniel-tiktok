{% extends "base.html" %}{% block content %}<section class="panel wide-panel"><small>LIVE STUDIO</small><h1>Go Live</h1><p>Browser camera preview is available. A real multi-viewer broadcast needs a WebRTC media server such as LiveKit, mediasoup or a managed streaming provider.</p><video id="preview" autoplay muted playsinline class="preview"></video><div class="actions"><button class="cta" onclick="startPreview()">Start camera preview</button><button class="cta secondary" onclick="stopPreview()">Stop preview</button></div><p id="liveStatus" class="sub">Camera is off.</p></section><script>let stream;async function startPreview(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('preview').srcObject=stream;document.getElementById('liveStatus').textContent='Local preview is running. Broadcast server is not connected.';}catch(e){document.getElementById('liveStatus').textContent='Camera permission unavailable: '+e.message;}}function stopPreview(){if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('preview').srcObject=null;document.getElementById('liveStatus').textContent='Camera is off.';}</script>{% endblock %}
