{% extends "base.html" %}{% block content %}<section class="panel wide-panel"><small>PRIVATE CHAT</small><h1>@{{ other.username }}</h1><div class="thread">{% for m in thread %}<div class="bubble {{ 'mine' if m.sender_id==current_user.id else '' }}"><b>{{ 'You' if m.sender_id==current_user.id else '@'+m.username }}</b><p>{{ m.body }}</p><small>{{ m.created_at[:16] }}</small></div>{% else %}<p>No messages yet. Say hello!</p>{% endfor %}</div><form method="post" class="send"><input name="body" maxlength="2000" placeholder="Write a private message…" required><button class="cta">Send</button></form></section>{% endblock %}
